spring.application.name=garage-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/garage}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.security.google.client-id=${GOOGLE_CLIENT_ID}
app.security.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.seed.products.enabled=${PRODUCT_SEED_ENABLED:true}
app.order.expiration=${ORDER_EXPIRATION:PT24H}
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
mercadopago.base-url=${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}
mercadopago.sandbox-payer-email=${MERCADO_PAGO_SANDBOX_PAYER_EMAIL:}
mercadopago.webhook-secret=${MERCADO_PAGO_WEBHOOK_SECRET:}
mercadopago.diagnostic-logging=${MERCADO_PAGO_DIAGNOSTIC_LOGGING:true}
