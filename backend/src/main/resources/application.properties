spring.application.name=garage-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/garage}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:db/migration/V20260820_01__order_item_supplier_snapshot.sql,classpath:db/migration/V20260820_02__order_shipping_provider_snapshot.sql
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.security.google.client-id=${GOOGLE_CLIENT_ID}
app.security.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.currency.usd-brl-rate=${USD_BRL_RATE:5.50}
app.business.time-zone=${BUSINESS_TIME_ZONE:America/Sao_Paulo}
app.account.email.mode=${ACCOUNT_EMAIL_MODE:disabled}
app.account.email.resend.api-key=${RESEND_API_KEY:}
app.account.email.from=${ACCOUNT_EMAIL_FROM:onboarding@resend.dev}
app.account.email-verification-expiration=${EMAIL_VERIFICATION_EXPIRATION:PT24H}
app.account.password-reset-expiration=${PASSWORD_RESET_EXPIRATION:PT15M}
app.seed.products.enabled=${PRODUCT_SEED_ENABLED:false}
app.order.expiration=${ORDER_EXPIRATION:PT24H}
app.shipping.standard.price=${SHIPPING_STANDARD_PRICE:18.90}
app.shipping.standard.estimated-days=${SHIPPING_STANDARD_ESTIMATED_DAYS:8}
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
mercadopago.base-url=${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}
mercadopago.sandbox-payer-email=${MERCADO_PAGO_SANDBOX_PAYER_EMAIL:}
mercadopago.webhook-secret=${MERCADO_PAGO_WEBHOOK_SECRET:}
mercadopago.diagnostic-logging=${MERCADO_PAGO_DIAGNOSTIC_LOGGING:true}
mercadopago.checkout-pro.sandbox=${MERCADO_PAGO_CHECKOUT_SANDBOX:false}
mercadopago.checkout-pro.success-url=${MERCADO_PAGO_CHECKOUT_SUCCESS_URL:}
mercadopago.checkout-pro.pending-url=${MERCADO_PAGO_CHECKOUT_PENDING_URL:}
mercadopago.checkout-pro.failure-url=${MERCADO_PAGO_CHECKOUT_FAILURE_URL:}
mercadopago.checkout-pro.notification-url=${MERCADO_PAGO_CHECKOUT_NOTIFICATION_URL:}

cj.api-key=${CJ_API_KEY:}
cj.base-url=${CJ_BASE_URL:https://developers.cjdropshipping.com}
cj.token-expiry-skew=${CJ_TOKEN_EXPIRY_SKEW:PT5M}
cj.connect-timeout=${CJ_CONNECT_TIMEOUT:PT10S}
cj.read-timeout=${CJ_READ_TIMEOUT:PT20S}
cj.diagnostic-logging=${CJ_DIAGNOSTIC_LOGGING:true}
