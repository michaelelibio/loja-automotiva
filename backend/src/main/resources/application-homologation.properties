# Local-only sandbox. Never inherits DB_URL or MERCADO_PAGO_ACCESS_TOKEN.
server.address=127.0.0.1
server.port=18080
spring.datasource.url=jdbc:postgresql://127.0.0.1:${HML_POSTGRES_PORT:55439}/ingarage_homologation
spring.datasource.username=ingarage_hml
spring.datasource.password=${HML_POSTGRES_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
app.security.jwt.secret=${HML_JWT_SECRET}
app.security.google.client-id=homologation-disabled.apps.googleusercontent.com
app.security.frontend-url=${HML_FRONTEND_URL:http://localhost:3000}
app.security.cors.allowed-origins=${HML_FRONTEND_URL:http://localhost:3000}
app.account.email.mode=disabled
app.seed.products.enabled=false
app.payment.creation-enabled=${HML_PAYMENT_CREATION_ENABLED:false}
mercadopago.access-token=${HML_MERCADO_PAGO_ACCESS_TOKEN}
mercadopago.base-url=https://api.mercadopago.com
mercadopago.webhook-secret=${HML_MERCADO_PAGO_WEBHOOK_SECRET}
mercadopago.diagnostic-logging=false
mercadopago.checkout-pro.sandbox=true
mercadopago.checkout-pro.success-url=${HML_MERCADO_PAGO_SUCCESS_URL}
mercadopago.checkout-pro.pending-url=${HML_MERCADO_PAGO_PENDING_URL}
mercadopago.checkout-pro.failure-url=${HML_MERCADO_PAGO_FAILURE_URL}
mercadopago.checkout-pro.notification-url=${HML_MERCADO_PAGO_NOTIFICATION_URL}
aliexpress.app-key=
aliexpress.app-secret=
aliexpress.token-encryption-key=
aliexpress.orders.enabled=false
aliexpress.orders.contract-confirmed=false
cj.api-key=
dsers.simulation.enabled=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
