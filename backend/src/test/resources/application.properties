spring.datasource.url=jdbc:h2:mem:garage;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never
app.security.jwt.secret=test-only-secret-with-at-least-32-characters
app.security.jwt.expiration=PT1H
app.security.google.client-id=test-google-client-id.apps.googleusercontent.com
app.security.frontend-url=http://localhost:3000
app.account.email.mode=development
app.account.email-verification-expiration=PT24H
app.account.password-reset-expiration=PT15M
app.seed.products.enabled=false
app.order.expiration=PT24H
app.shipping.standard.price=18.90
app.shipping.standard.estimated-days=8
app.currency.usd-brl-rate=5.50
mercadopago.webhook-secret=test-webhook-secret
